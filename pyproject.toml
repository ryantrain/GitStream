[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitstream"
version = "0.1.0"
description = "Engineering workflow intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "requests>=2.32.3",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.1",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "alembic>=1.13.0",
  "numpy>=2.1.0",
  "pandas>=2.2.3",
  "scikit-learn>=1.6.1",
  "lightgbm>=4.5.0",
  "xgboost>=2.1.2",
  "joblib>=1.4.0",
  "arq>=0.26.0",
  "python-dotenv>=1.0.1",
  "structlog>=24.1.0",
  "prometheus-client>=0.21.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "httpx>=0.28.1",
  "ruff>=0.9.0",
  "mypy>=1.14.1"
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
